name: Fetch XAUUSD data

# Publishes spot XAUUSD levels on demand. The 7am morning-brief routine pushes an empty
# commit to a claude/ branch, which starts this run within seconds; the routine then waits
# for data/xau.json on main to carry a fresh generated_ny before writing the email.
#
# There is deliberately no cron schedule: GitHub ran the old 06:50 schedule up to four
# hours late, so the brief kept reading the previous day's levels.

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-xau-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install curl_cffi (browser TLS fingerprint, so Yahoo does not throttle)
        run: pip install --quiet curl_cffi

      - name: Fetch spot XAUUSD candles from Dukascopy
        run: |
          python3 xau_data.py > data/xau.json || echo "script exit code $?"
          head -c 400 data/xau.json

      - name: Fetch ES, NQ and GC futures from Yahoo
        run: |
          python3 futures_data.py > data/futures.json || echo "script exit code $?"
          head -c 300 data/futures.json

      - name: Fetch this week's economic calendar
        run: |
          curl -sS --max-time 60 -o data/calendar.json \
            "https://nfs.faireconomy.media/ff_calendar_thisweek.json" \
            || echo '{"error":"calendar fetch failed"}' > data/calendar.json
          wc -c data/calendar.json

      - name: Commit the data to main
        run: |
          git config user.name "xau-data-bot"
          git config user.email "actions@github.com"
          git add data/xau.json data/futures.json data/calendar.json
          git commit -m "Data for $(TZ=America/New_York date +'%Y-%m-%d %H:%M %Z')" || echo "nothing to commit"
          git push origin HEAD:main
